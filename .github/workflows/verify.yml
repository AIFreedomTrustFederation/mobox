{
  "name": "MoBox Source Validation",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "mobox-validation-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Clone triggering commit",
          "env": {
            "TARGET_SHA": "${{ github.sha }}"
          },
          "run": "set -Eeuo pipefail\ngit init\ngit remote add origin \"https://github.com/${GITHUB_REPOSITORY}.git\"\ngit fetch --depth=1 origin \"$TARGET_SHA\"\ngit checkout --detach FETCH_HEAD\n"
        },
        {
          "name": "Validate shell syntax",
          "run": "bash -n install\nsh -n .aift/commands/status.sh"
        },
        {
          "name": "Validate federation indexes",
          "run": "python3 federation/scripts/validate-index.py"
        },
        {
          "name": "Confirm validation is non-mutating",
          "run": "git diff --exit-code && test -z \"$(git status --short)\""
        }
      ]
    }
  }
}
